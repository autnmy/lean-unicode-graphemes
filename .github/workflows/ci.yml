name: CI

on:
  push:
  pull_request:

# The job only reads the code, so the token gets no write access.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The theorem statements are fixed: their SHA-256 must equal the one line
      # README.md records for them. Exactly one such line is required, so a
      # missing, duplicated or malformed line fails instead of checking nothing.
      # This runs before the build so it hashes the bytes git checked out.
      - name: Check the theorem statements against their recorded SHA-256
        env:
          LC_ALL: C
        run: |
          pattern='^[0-9a-f]{64}  Segmentation/Statements\.lean$'
          count=$(grep -cE "$pattern" README.md || true)
          if [ "$count" -ne 1 ]; then
            echo "README.md must hold exactly one SHA-256 line for Segmentation/Statements.lean; found $count." >&2
            exit 1
          fi
          grep -E "$pattern" README.md | sha256sum --check --strict
      # The Unicode data files are pinned: each must match its digest in
      # SHA256SUMS. Exactly five well-formed lines are required, so a dropped or
      # extra entry fails instead of checking fewer files. This runs before the
      # build so it hashes the bytes git checked out.
      - name: Check the Unicode data files against SHA256SUMS
        working-directory: data/ucd/18.0.0
        env:
          LC_ALL: C
        run: |
          pattern='^[0-9a-f]{64}  [A-Za-z0-9_./-]+$'
          lines=$(wc -l < SHA256SUMS)
          count=$(grep -cE "$pattern" SHA256SUMS || true)
          if [ "$lines" -ne 5 ] || [ "$count" -ne 5 ]; then
            echo "SHA256SUMS must hold exactly five well-formed lines; found $count of $lines." >&2
            exit 1
          fi
          sha256sum --check --strict SHA256SUMS
      # Installs the toolchain named in lean-toolchain. Build and test are
      # requested explicitly so the test step never depends on auto-detection.
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          auto-config: false
          build: true
          test: true
      # The committed tables must be exactly what the generator writes from the
      # data files. `git status` also reports new untracked and deleted files,
      # which `git diff` alone would miss. A generator that fails stops the step.
      - name: Check the committed tables match the generator
        run: |
          set -e
          lake exe gen-tables
          changes=$(git status --porcelain -- Segmentation/Tables)
          if [ -n "$changes" ]; then
            echo "The committed tables differ from lake exe gen-tables output:" >&2
            echo "$changes" >&2
            git diff -- Segmentation/Tables >&2
            exit 1
          fi
