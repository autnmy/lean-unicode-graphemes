name: CI

on:
  push:
  pull_request:

# The job only reads the code, so the token gets no write access.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The theorem statements are fixed: their SHA-256 must equal the one line
      # README.md records for them. Exactly one such line is required, so a
      # missing, duplicated or malformed line fails instead of checking nothing.
      # This runs before the build so it hashes the bytes git checked out.
      - name: Check the theorem statements against their recorded SHA-256
        env:
          LC_ALL: C
        run: |
          pattern='^[0-9a-f]{64}  Segmentation/Statements\.lean$'
          count=$(grep -cE "$pattern" README.md || true)
          if [ "$count" -ne 1 ]; then
            echo "README.md must hold exactly one SHA-256 line for Segmentation/Statements.lean; found $count." >&2
            exit 1
          fi
          grep -E "$pattern" README.md | sha256sum --check --strict
      # The Unicode data files are pinned: each file SHA256SUMS lists must match
      # its digest. Which files the list must name is checked by `lake test`
      # (SegmentationDev.TableGen.checkDigestList), so the list is stated in one place. This runs
      # before the build so it hashes the bytes git checked out.
      - name: Check the Unicode data files against SHA256SUMS
        working-directory: data/ucd/18.0.0
        env:
          LC_ALL: C
        run: sha256sum --check --strict SHA256SUMS
      # Installs the toolchain named in lean-toolchain. It builds and tests nothing: the steps
      # below run every build themselves with `--wfail`, so the flag shows on each build's own
      # command line in this log, and no module is first built without it.
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          auto-config: false
          build: false
          test: false
      # lean-action may restore `.lake` from an earlier run's cache. Lake does not compile a module
      # again when its restored output is up to date, so the timed GraphemeBreakTest.txt step below
      # would reuse an old proof and time nothing. Deleting every build output here, before the
      # first build, does not depend on the action's cache settings or on which caches GitHub still
      # holds, so every module is compiled in this run.
      - name: Remove build outputs restored from earlier runs
        run: rm -rf .lake/build
      # Every build runs with `--wfail`, so a compiler warning fails CI. The order matters: the
      # timed GraphemeBreakTest.txt step must compile its two modules itself, before the build of
      # the development libraries, whose SegmentationChecks library also holds those modules. If
      # that build ran first, the timed step would reuse its result and never time the proof.
      # Every later step reads the output of these builds.
      - name: Build the library with warnings as errors
        env:
          LC_ALL: C
        run: lake build --wfail
      # Proves by `decide +kernel` that `graphemes` matches all 853 lines of GraphemeBreakTest.txt,
      # and fails if that proof depends on an axiom outside the three standard ones. The test
      # driver does not import this module or its tests, so this step is the only place CI checks
      # them, and the time limit bounds the whole check: a proof that needs 10 minutes or more
      # fails. Restored outputs were deleted above, and only this run's Segmentation library build
      # exists when this step starts, so the limit also covers compiling the modules these two
      # import that are not in it, such as SegmentationDev.TableGen,
      # SegmentationDev.Test.GraphemeBreakTestFile, SegmentationDev.Test.GraphemeBreakTestData and
      # SegmentationDev.Gate.Axioms. The step first fails if the theorem is already built, by a
      # cache or by an earlier step, because the limit would then time nothing. The tests also run
      # the decided check over all 853 cases, against a segmenter that never joins, to show it can
      # fail.
      - name: Check the GraphemeBreakTest.txt theorem within 10 minutes
        timeout-minutes: 10
        env:
          LC_ALL: C
        run: |
          set -eu
          prebuilt=.lake/build/lib/lean/SegmentationDev/Test/GraphemeBreakTestTheorem.olean
          if [ -e "$prebuilt" ]; then
            echo "$prebuilt exists before the timed build, so the 10-minute limit would not time the proof." >&2
            exit 1
          fi
          lake build --wfail SegmentationDev.Test.GraphemeBreakTestTheorem SegmentationDev.Test.GraphemeBreakTestTheoremTests
      # Plain `lake build` builds only the Segmentation library. This builds the development
      # libraries and all three executables, so the tests, the generator and the scanner are also
      # compiled with warnings as errors before any of them runs.
      - name: Build the development libraries and executables with warnings as errors
        env:
          LC_ALL: C
        run: lake build --wfail SegmentationTableGen SegmentationChecks SegmentationGate segmentation-tests gen-tables keyword-scan
      # Runs the test driver, built with `--wfail` above.
      - name: Run the tests
        env:
          LC_ALL: C
        run: lake test
      # Shows each headline theorem's `#print axioms` output in this log and fails if any of them
      # depends on an axiom outside propext, Classical.choice and Quot.sound. The theorem list is
      # in SegmentationDev/Test/HeadlineAxioms.lean; `#assert_axioms` fails on a name that does not
      # resolve, so a renamed theorem cannot drop out unnoticed. It reads the SegmentationGate and
      # Segmentation builds above.
      - name: Print and check the axioms of the headline theorems
        env:
          LC_ALL: C
        run: |
          set -eu
          lake env lean SegmentationDev/Test/HeadlineAxioms.lean
      # A check that has only ever passed could be checking nothing, so this plants a sorry, a
      # native_decide and a user axiom in throwaway files and fails unless the check rejects each.
      - name: Check that the axiom check rejects forbidden axioms
        env:
          LC_ALL: C
        run: sh scripts/axiom-gate-self-test.sh
      # Project code may not use sorry, admit, axiom, native_decide, implemented_by, extern or
      # unsafe. The scanner skips comments, plain string text and «» names, where the test files
      # name these words as prose. It first runs its own exit-code test, which the test
      # driver does not import. It then gets every tracked .lean file from
      # git and fails when given none, so it cannot pass by scanning nothing.
      - name: Check project code for forbidden words
        env:
          LC_ALL: C
        run: |
          set -euo pipefail
          lake build --wfail keyword-scan
          lake env lean SegmentationDev/Test/KeywordScanMainExitCodes.lean
          git ls-files -z '*.lean' | xargs -0 lake exe keyword-scan
      # The committed tables and GraphemeBreakTest.txt cases must be exactly what
      # the generator writes from the data files. `git status` also reports new
      # untracked and deleted files, which `git diff` alone would miss. A
      # generator that fails stops the step.
      - name: Check the committed tables match the generator
        run: |
          set -e
          lake exe gen-tables
          generated="Segmentation/Tables SegmentationDev/Test/GraphemeBreakTestData.lean"
          changes=$(git status --porcelain -- $generated)
          if [ -n "$changes" ]; then
            echo "The committed generated files differ from lake exe gen-tables output:" >&2
            echo "$changes" >&2
            git diff -- $generated >&2
            exit 1
          fi
