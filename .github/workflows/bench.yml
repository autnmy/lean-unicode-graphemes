name: Benchmark

# Measures this library's reference and fast segmenters against UnicodeExtra (bench/). It runs on pushes to main, on manual
# dispatch, and on pull requests that change the benchmark, this workflow, the library, its
# lakefile or its toolchain, so a broken benchmark is seen before it lands. The benchmark builds the library by
# path on its own toolchain (bench/lean-toolchain), so a library change can break it even when
# the library's own checks pass. It is a workflow of its own, so it never delays the checks
# in ci.yml. Pull requests use `pull_request`, never `pull_request_target`, so a fork's code runs
# with the read-only token below and no secrets.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'bench/**'
      - '.github/workflows/bench.yml'
      - 'Segmentation/**'
      - 'Segmentation.lean'
      - 'lean-toolchain'
      - 'lakefile.toml'
  workflow_dispatch:

# The job compiles and runs third-party code (the copies in bench/vendor/), so its token can only
# read.
# Uploading an artifact needs no further permission.
permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: bench
    env:
      LC_ALL: C
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs elan. The action runs on the root package, not on bench/.
      # The build is staged by bench/build.sh below, so the action builds and tests nothing.
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          auto-config: false
          build: false
          test: false
      # The action installed the root package's toolchain. This installs the one named in
      # bench/lean-toolchain and fails unless `lean` in bench/ reports that version, so the
      # results are never labelled with a toolchain that did not run.
      - name: Install and check the bench toolchain
        run: |
          set -eu
          toolchain=$(cat lean-toolchain)
          elan toolchain install "$toolchain"
          version=$(lean --version)
          echo "$version"
          expected="version ${toolchain#leanprover/lean4:v},"
          case "$version" in
            *"$expected"*) ;;
            *)
              echo "Expected lean to report $expected from $toolchain; got: $version" >&2
              exit 1
              ;;
          esac
      # Every dependency is a path in this checkout and bench/lake-manifest.json is committed, so
      # nothing is fetched. The results file reports the run metadata set here.
      - name: Record the run metadata
        run: |
          set -eu
          # The UnicodeExtra commit that bench/vendor/UnicodeExtra was copied from. The copy is
          # re-made by hand, so this changes only when it is.
          theirs_commit=44228db53c8104753bf02bff36279a65ea46dce4
          cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | sed 's/^ *//')
          {
            echo "BENCH_THEIRS_COMMIT=$theirs_commit"
            echo "BENCH_OURS_COMMIT=$GITHUB_SHA"
            echo "BENCH_TOOLCHAIN=$(cat lean-toolchain)"
            echo "BENCH_MACHINE=$cpu, $(nproc) cores, $(uname -a)"
          } >> "$GITHUB_ENV"
      # Builds each library, then a module that imports both, then the benchmark. A library
      # failure writes results.md saying the two cannot build together; a failure in the
      # benchmark's own code is reported as a harness failure and writes nothing.
      # A stand-in `lake` fails each build target in turn: only a library target may write the
      # "cannot build together" results file, and every failure must fail the script.
      - name: Check that the build script tells library failures from harness failures
        run: sh build-self-test.sh
      - name: Build both libraries and the benchmark
        run: sh build.sh results.md
      # The input, comparison and report tests. They run before anything is timed.
      - name: Run the bench tests
        run: lake test
      # A comparison that has only ever passed could be checking nothing, so this drops one of
      # this library's clusters and fails unless `check` exits with status 1 and names the
      # difference.
      - name: Check that a cluster difference fails the comparison
        run: |
          set +e
          output=$(lake exe bench check --break-ours 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 1 ]; then
            echo "Expected exit status 1 from a broken comparison; got $status." >&2
            exit 1
          fi
          if ! printf '%s\n' "$output" | grep -q "clusters differ on input"; then
            echo "The broken comparison did not print the first difference." >&2
            exit 1
          fi
      # The same self-test for the fast slice segmenter: it drops one of the fast clusters only.
      - name: Check that a fast-cluster difference fails the comparison
        run: |
          set +e
          output=$(lake exe bench check --break-fast 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 1 ]; then
            echo "Expected exit status 1 from a broken comparison; got $status." >&2
            exit 1
          fi
          if ! printf '%s\n' "$output" | grep -q "clusters differ on input"; then
            echo "The broken comparison did not print the first difference." >&2
            exit 1
          fi
      # The reference segmenter, the fast segmenter and UnicodeExtra must return the same
      # clusters on every input before any of them is timed.
      - name: Compare the three segmenters' clusters on every input
        run: lake exe bench check
      # The report lists whether the fast median is at most UnicodeExtra's maximum sample on
      # each input. A missed pass mark is reported, not enforced, so this step passing does not
      # mean the mark was met: read the "Pass mark" lines in results.md.
      - name: Time the three segmenters and record their peak memory
        run: lake exe bench report results.md
      # Uploads the results table, or the "cannot build together" result when a library failed
      # to build. It is skipped when no results file was written.
      - name: Upload the results
        if: always() && hashFiles('bench/results.md') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-results
          path: bench/results.md
          if-no-files-found: error
