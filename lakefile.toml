name = "segmentation"
version = "0.1.0"
defaultTargets = ["Segmentation"]
# Lake reads this value as a Lean name, so a target name with a hyphen
# has to be written in «» or the lookup fails.
testDriver = "«segmentation-tests»"

[[lean_lib]]
name = "Segmentation"

# Parses the UCD files into the property tables. Kept out of `Segmentation` so
# users of the library do not build the parser; the test driver imports it.
[[lean_lib]]
name = "TableGen"

# Compile-time checks of the theorem statements. The test driver imports them, and Lake
# resolves an import only to a module that some library of the package owns.
[[lean_lib]]
name = "SegmentationChecks"
roots = []
globs = ["SegmentationTest.+"]

[[lean_exe]]
name = "segmentation-tests"
root = "SegmentationTest"
