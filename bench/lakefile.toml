name = "bench"
description = "Benchmark of lean-unicode-graphemes against UnicodeExtra on the same inputs"
# A package of its own, so the library's root package keeps no dependencies. Run from `bench/`:
# `lake test` runs the bench tests. Every dependency is a path in this checkout, so nothing is
# fetched.
testDriver = "«bench-tests»"

# A misspelled name must be an error, not a fresh implicit variable.
[leanOptions]
autoImplicit = false

# The library under test, read from this checkout. Lake writes the hyphenated name in «» in
# the manifest it generates.
[[require]]
name = "lean-unicode-graphemes"
path = ".."

# UnicodeExtra's source at commit 44228db, copied unchanged except for its lean-toolchain and
# its UnicodeBasic require, so the benchmark builds with no network. Re-copy it by hand to
# compare against a newer UnicodeExtra.
[[require]]
name = "UnicodeExtra"
path = "vendor/UnicodeExtra"

# Inputs, comparison, statistics and reporting. Lake resolves an import only to a module that
# some library of the package owns.
[[lean_lib]]
name = "Bench"
roots = []
globs = ["Bench.+"]

# The bench test modules the test driver imports. The glob matches submodules only, so the
# driver `BenchTest`, which defines `main`, stays out.
[[lean_lib]]
name = "BenchChecks"
roots = []
globs = ["BenchTest.+"]

# Compares both libraries' clusters, then measures them: `lake exe bench check`, then
# `lake exe bench report results.md`.
[[lean_exe]]
name = "bench"
root = "Main"

# Writes the results file when the two libraries cannot build together. It imports neither
# library, so it builds when they do not.
[[lean_exe]]
name = "bench-build-failure"
root = "BuildFailureMain"

[[lean_exe]]
name = "bench-tests"
root = "BenchTest"
